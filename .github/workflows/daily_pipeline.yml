name: ModelJoust Daily Pipeline

on:
  schedule:
    # 23:55 UTC = ok. 18:55-19:55 czasu New York (zależnie od EDT/EST) -
    # duży zapas po zamknięciu rynku. Celowo BLISKO końca doby UTC, ale
    # wciąż w tym samym dniu tygodnia UTC co sesja w NY - dzięki temu dni
    # tygodnia w cronie (pon-pt) pokrywają się wprost z dniami sesyjnymi,
    # bez przesunięcia o dzień, jak byłoby przy porze bliższej północy NY.
    - cron: "55 23 * * 1-5"
  workflow_dispatch:

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t model-joust .

      - name: Run pipeline
        run: |
          docker run --rm \
            -e SUPABASE_URL="${{ secrets.SUPABASE_URL }}" \
            -e SUPABASE_KEY="${{ secrets.SUPABASE_KEY }}" \
            -e GROQ_API_KEY="${{ secrets.GROQ_API_KEY }}" \
            model-joust
