name: ModelJoust Sensitivity Sweep

on:
  schedule:
    # Siatka bezpieczeństwa, nie "jedna kombinacja na odpalenie" - skrypt
    # sam pilnuje czasu (TIME_BUDGET_HOURS w sensitivity_analysis/run_sweep.py)
    # i kończy się czysto z zapasem przed limitem 6h na hostowanym runnerze,
    # a każde kolejne uruchomienie kontynuuje od pierwszej niezrobionej
    # kombinacji (sprawdzane w sensitivity_sweep_results).
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  run-sweep:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run sensitivity sweep
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python sensitivity_analysis/run_sweep.py
